name: probe
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: review event probes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          set +e
          for EV in APPROVE REQUEST_CHANGES COMMENT; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              -d "{\"event\":\"$EV\",\"body\":\"probe-$EV\"}")
            echo "=== $EV HTTP=$code"
            cat /tmp/out
            echo
          done
